<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrowWrite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowRead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="700" rx="16" fill="#0d1224"/>

  <text x="460" y="52" text-anchor="middle" fill="#e8ebf6" font-size="26" font-weight="700">SimpleStorage DApp — Architecture</text>
  <text x="460" y="82" text-anchor="middle" fill="#9aa3c0" font-size="14">Reads use a read-only public RPC · writes are signed by MetaMask and confirmed by the user</text>

  <!-- App box -->
  <rect x="210" y="110" width="500" height="96" rx="12" fill="#171f3a" stroke="#8b7cf6" stroke-width="1.5"/>
  <text x="460" y="150" text-anchor="middle" fill="#e8ebf6" font-size="17" font-weight="600">Next.js frontend (React) — Microsoft Edge</text>
  <text x="460" y="176" text-anchor="middle" fill="#9aa3c0" font-size="13">app/page.js · components · lib/ethereum.js · lib/contract.js (ethers v6)</text>

  <!-- MetaMask box -->
  <rect x="80" y="300" width="280" height="86" rx="12" fill="#171f3a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="220" y="336" text-anchor="middle" fill="#e8ebf6" font-size="16" font-weight="600">MetaMask (Edge extension)</text>
  <text x="220" y="360" text-anchor="middle" fill="#9aa3c0" font-size="12.5">signs transactions after user approval</text>

  <!-- RPC box -->
  <rect x="560" y="300" width="280" height="86" rx="12" fill="#171f3a" stroke="#34d399" stroke-width="1.5"/>
  <text x="700" y="336" text-anchor="middle" fill="#e8ebf6" font-size="16" font-weight="600">Sepolia JSON-RPC endpoint</text>
  <text x="700" y="360" text-anchor="middle" fill="#9aa3c0" font-size="12.5">read-only eth_call</text>

  <!-- Network box -->
  <rect x="230" y="470" width="460" height="70" rx="12" fill="#131a33" stroke="#2a3560" stroke-width="1.5"/>
  <text x="460" y="501" text-anchor="middle" fill="#e8ebf6" font-size="16" font-weight="600">Ethereum Sepolia testnet</text>
  <text x="460" y="524" text-anchor="middle" fill="#9aa3c0" font-size="13">chain ID 11155111</text>

  <!-- Contract box -->
  <rect x="280" y="600" width="360" height="76" rx="12" fill="#171f3a" stroke="#8b7cf6" stroke-width="1.5"/>
  <text x="460" y="630" text-anchor="middle" fill="#e8ebf6" font-size="16" font-weight="600">SimpleStorage.sol</text>
  <text x="460" y="654" text-anchor="middle" fill="#9aa3c0" font-size="13">setValue() · getValue() · ValueUpdated()</text>

  <!-- Write path arrows -->
  <path d="M 350 206 L 245 298" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowWrite)"/>
  <text x="255" y="248" text-anchor="middle" fill="#a78bfa" font-size="12.5">window.ethereum (EIP-1193)</text>
  <path d="M 245 386 L 335 468" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowWrite)"/>
  <text x="248" y="440" text-anchor="middle" fill="#a78bfa" font-size="12.5">signed transactions</text>

  <!-- Read path arrows -->
  <path d="M 570 206 L 675 298" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowRead)"/>
  <text x="672" y="248" text-anchor="middle" fill="#34d399" font-size="12.5">JsonRpcProvider</text>
  <path d="M 675 386 L 585 468" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowRead)"/>
  <text x="685" y="440" text-anchor="middle" fill="#34d399" font-size="12.5">eth_call</text>

  <!-- network -> contract -->
  <path d="M 460 540 L 460 598" stroke="#8b7cf6" stroke-width="2" fill="none" marker-end="url(#arrowWrite)"/>
</svg>
